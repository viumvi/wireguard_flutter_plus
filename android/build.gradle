group 'orban.group.wireguard_flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // wgtunnel/core requires Android 8.0+
        minSdkVersion 26
    }

    namespace 'orban.group.wireguard_flutter'
}

// wgtunnel/core fork with ExcludedIPs support, published to mavenLocal
def wgtunnelCore = '1.9.0-vpnka.1'

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.wgtunnel:backend:$wgtunnelCore"
    implementation "com.wgtunnel:parser:$wgtunnelCore"
    // hevtunnel is unchanged in the fork, so use the Maven Central build (it ships the native libs)
    implementation("com.wgtunnel:hevtunnel") { version { strictly '1.9.0' } }
    implementation "com.wgtunnel:backend-android-jni:$wgtunnelCore"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.core:core-ktx:1.19.1'
}
